name: build
on:
  schedule: [{cron: '23 * * * *'}]
  workflow_dispatch:
permissions: {contents: write, actions: write}
concurrency: {group: build, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q playwright pillow
      - name: Build (live feed -> labels, new cards, gated images.csv, gallery)
        run: |
          python3 build.py --max 80
          python3 gallery.py
      - name: Commit
        run: |
          git config user.name "cards-bot"; git config user.email "cards-bot@users.noreply.github.com"
          git add -A c review feed manifest.json bad_images.json
          git diff --cached --quiet || (git commit -q -m "build $(date -u +%FT%TZ)" && git push origin HEAD:main)
      - name: Re-dispatch (GitHub cron drops runs; keeps the hourly chain alive)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          sleep 3000
          gh workflow run build.yml --ref main || true
